00}.hero{background:var(--green);color:white;padding:36px 40px;border-radius:18px;position:relative;overflow:hidden;min-height:228px;box-shadow:var(--shadow)}.hero:after{content:'DB';position:absolute;right:47px;top:-43px;font-family:'DM Sans';font-size:220px;line-height:1;font-weight:700;color:#ffffff0d;letter-spacing:-.1em}.eyebrow{font:500 10px 'DM Mono';letter-spacing:.16em;text-transform:uppercase;opacity:.74}.hero h1{font-size:clamp(25px,3vw,35px);line-height:1.4;margin:10px 0 8px;max-width:660px}.hero p{margin:0;color:#d7e9df;font-size:13px}.hero .button{margin-top:21px;background:#fff;color:var(--green);border:0;padding:10px 17px;border-radius:8px;font-weight:700;font-size:12px;position:relative;z-index:1}.section-head{display:flex;justify-content:space-between;align-items:end;margin:32px 0 14px}.section-head h2{font-size:17px;margin:0}.section-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.linkbtn{border:0;background:none;color:var(--green);font-weight:700;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:20px}.stat,.card{background:var(--paper);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.stat{padding:17px 19px;display:flex;justify-content:space-between;align-items:center}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{font:700 24px 'DM Sans';letter-spacing:-.03em}.stat .badge{width:35px;height:35px;display:grid;place-items:center;border-radius:10px;background:#f0f5ef}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.course{padding:18px;cursor:pointer;transition:.18s}.course:hover{transform:translateY(-2px);border-color:#aacbb8}.course .num{font:500 10px 'DM Mono';color:var(--green);letter-spacing:.1em}.course h3{font-size:14px;margin:9px 0 5px}.course p{font-size:11px;color:var(--muted);margin:0 0 15px;min-height:42px}.progress-line{height:5px;background:#edf0ed;border-radius:5px;overflow:hidden}.progress-line i{height:100%;background:#4f9a72;display:block;border-radius:5px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:7px}.lower{display:grid;grid-template-columns:1.35fr .85fr;gap:15px;margin-top:28px}.panel{padding:20px}.panel h3{font-size:14px;margin:0 0 14px}.topic-row{display:flex;gap:13px;align-items:center;padding:10px 0;border-bottom:1px solid #edf0ed}.topic-row:last-child{border:0}.topic-icon{width:35px;height:35px;border-radius:10px;background:#f0f5ef;display:grid;place-items:center}.topic-row b{font-size:12px;display:block}.topic-row small{color:var(--muted);font-size:10px}.topic-row span:last-child{margin-left:auto;color:var(--muted);font-size:11px}.daily{background:#f8f5ef;border-color:#eee8dd}.daily .quote{font-size:14px;font-weight:600;margin:8px 0 10px;line-height:1.9}.daily small{color:var(--muted);font-size:11px}.page-title{display:flex;justify-content:space-between;align-items:start;margin:5px 0 24px}.page-title h1{font-size:26px;margin:0}.page-title p{color:var(--muted);margin:4px 0;font-size:12px}.search{border:1px solid var(--line);border-radius:9px;background:white;padding:9px 12px;width:230px;outline:none}.search:focus{border-color:#6aab85}.lesson-layout{display:grid;grid-template-columns:230px 1fr;gap:18px}.lesson-list{padding:9px;height:max-content;position:sticky;top:15px}.lesson-list button{border:0;background:none;text-align:left;width:100%;padding:10px;border-radius:8px;color:#66736c;font-size:11px}.lesson-list button.active{background:var(--pale);color:var(--green);font-weight:700}.lesson-content{padding:clamp(20px,4vw,38px)}.lesson-content h1{font-size:26px;margin:0 0 4px}.lesson-content h2{font-size:18px;margin:30px 0 9px;padding-bottom:8px;border-bottom:1px solid var(--line)}.lesson-content h3{font-size:14px;margin:19px 0 5px}.lesson-content p,.lesson-content li{font-size:13px;color:#425149}.lesson-content .lead{font-size:14px;color:#58665f}.callout{background:#eff6f0;border-left:3px solid var(--green);padding:13px 16px;border-radius:0 8px 8px 0;font-size:12px;margin:18px 0}.lesson-content table{width:100%;border-collapse:collapse;font-size:12px;margin:13px 0}.lesson-content th,.lesson-content td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.lesson-content th{background:#f5f7f4}.lesson-content code{font:12px 'DM Mono';background:#f1f4f1;padding:2px 5px;border-radius:4px}.quiz-card{padding:23px;margin-bottom:13px}.quiz-card h3{font-size:14px;margin:0 0 14px}.option{display:block;width:100%;text-align:left;margin:7px 0;padding:11px 13px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12px;color:#45534c}.option:hover{border-color:#91bea2}.option.correct{background:#eaf6ed;border-color:#6eaa7c}.option.wrong{background:#fff0eb;border-color:#e59b7a}.explain{margin-top:11px;background:#f5f7f4;padding:11px;border-radius:8px;font-size:11px;color:#526158}.tabs{display:flex;gap:7px;margin-bottom:18px}.tab{padding:8px 14px;border:1px solid var(--line);background:white;border-radius:20px;font-size:11px;color:#58655e}.tab.active{background:var(--green);border-color:var(--green);color:white}.flash{min-height:250px;padding:30px;display:grid;place-items:center;text-align:center;cursor:pointer}.flash .term{font-size:25px;font-weight:700}.flash .hint{font-size:11px;color:var(--muted);margin-top:10px}.flash .definition{font-size:15px;max-width:540px}.flash-actions{display:flex;justify-content:center;gap:10px;margin:14px}.primary,.secondary{border-radius:8px;padding:10px 16px;font-weight:700;font-size:12px}.primary{background:var(--green);color:#fff;border:1px solid var(--green)}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.empty{text-align:center;padding:45px;color:var(--muted)}.footer{text-align:center;font-size:10px;color:#98a29b;margin-top:36px}

<script>
const modules=[
{id:'intro',title:'データベースの基礎',icon:'🗄️',time:'15分',desc:'データベースとDBMSの役割、ファイル方式との違いを理解する。',sections:[['データベースとは','データベース（DB）は、関連するデータを整理して蓄積し、必要なときに検索・更新・共有できるようにしたものです。顧客台帳、在庫、銀行口座など、業務で扱うデータを一貫性のある形で管理します。','DBMS（データベース管理システム）は、DBの定義・作成・検索・更新・保護を担うソフトウェアです。利用者やアプリケーションとデータの間に立ち、同時利用や障害からデータを守ります。'],['DBMSを使う理由','ファイルを個別のプログラムで管理すると、同じデータの重複、更新漏れ、データ形式とプログラムの強い結び付き、同時更新の衝突が起きやすくなります。DBMSはデータを一元管理し、複数アプリケーションから共通に利用できます。','主な利点は、データ独立性、重複の抑制、一貫性の維持、同時実行制御、アクセス制御、障害回復です。一方、導入・運用コストやDBMSへの依存も考慮します。'],['データモデル','データモデルは、データの構造・関連・制約を表す考え方です。代表的な関係データモデルでは、データを表（リレーション）として表します。行がレコード（タプル）、列が属性（アトリビュート）です。','概念設計では実世界をER図などで表し、論理設計で関係表へ変換し、物理設計で格納方法や索引を決めます。論理データ独立性は論理構造の変更から利用者を守り、物理データ独立性は格納方法の変更から論理構造を守ります。'],['データベースの種類','関係データベース（RDB）は表とSQLを使い、業務システムで広く利用されます。NoSQLはキーバリュー、ドキュメント、列指向、グラフなど多様なデータモデルを持ち、大規模分散や柔軟な構造に向きます。','データウェアハウスは分析用に統合・蓄積したデータ基盤、データマートは特定部門・目的向けのデータ集合です。OLTPは日々の取引処理、OLAPは蓄積データの多角的な分析を指します。']]},
{id:'relational',title:'関係データベースとERモデル',icon:'▦',time:'20分',desc:'表の構成、キー、ER図と関係表への変換を学ぶ。',sections:[['関係データベースの用語','関係（リレーション）は表、タプルは行、属性は列、ドメインは属性が取り得る値の集合です。表の行順・列順に意味はなく、同じ行が重複しない集合として扱うのが理論上の基本です。','NULLは値が不明・未設定・該当なしであることを表し、0や空文字とは異なります。NULLとの比較は真偽値ではなくUNKNOWNになり、WHERE句ではTRUEの行だけが選ばれます。'],['キーと制約','候補キーは行を一意に識別できる最小の属性集合です。候補キーの一つを主キーとして選びます。主キーは一意でNULL不可です。主キー以外の候補キーは代替キーと呼びます。','外部キーは他表の候補キー（通常は主キー）を参照し、表間の参照整合性を保ちます。ドメイン制約は値の範囲、エンティティ整合性は主キーの一意性と非NULL、参照整合性は外部キーが参照先に存在することを保証します。'],['ERモデル','エンティティは管理対象（社員・商品）、属性はその性質（社員番号・氏名）、リレーションシップはエンティティ間の関連（社員が部署に所属）です。ER図で概念設計を表します。','多重度は1対1、1対多、多対多などの対応数を表します。多対多は関係表にするとき、中間表を作り、両側の主キーを外部キーとして持たせます。弱エンティティは所有者の識別子と部分キーを組み合わせて識別します。'],['ER図から表へ','エンティティごとに表を作り、識別子を主キーにします。1対多では「多」側に「1」側の主キーを外部キーとして置きます。1対1では業務上の従属関係や任意性を考えて外部キーの置き場所を決めます。','多対多では対応表（例：受講者と講座から受講表）を作ります。リレーションシップ自身の属性（受講日など）も対応表に置きます。複合属性は必要に応じて分解し、繰り返し属性は別表にします。']]},
{id:'sql',title:'SQLの基本',icon:'⌘',time:'25分',desc:'データ定義・検索・追加・更新・削除を使い分ける。',sections:[['SQLと命令の分類','SQLは関係データベースを操作する言語です。DDLは表などの定義（CREATE、ALTER、DROP）、DMLはデータ操作（SELECT、INSERT、UPDATE、DELETE）、DCLは権限（GRANT、REVOKE）、TCLはトランザクション制御（COMMIT、ROLLBACK）です。','CREATE TABLEで表を作成し、データ型（INTEGER、VARCHAR、DATEなど）や制約（PRIMARY KEY、FOREIGN KEY、NOT NULL、UNIQUE、CHECK）を指定します。'],['検索の基本','SELECTで列、FROMで表、WHEREで行の条件、ORDER BYで並び順を指定します。例：<code>SELECT name FROM Student WHERE score >= 80 ORDER BY score DESC;</code>。列の別名にはAS、重複行の除去にはDISTINCTを使います。','条件には比較演算子、AND/OR/NOT、BETWEEN、IN、LIKE（%は任意の文字列、_は任意の1文字）、IS NULLを使います。NULLは= NULLでは判定せず、IS NULLを使います。'],['集約とグループ化','COUNT、SUM、AVG、MAX、MINは集約関数です。GROUP BYでグループごとに集約し、HAVINGで集約後のグループを絞り込みます。WHEREは集約前の行を絞ります。','例：<code>SELECT dept, AVG(salary) FROM Employee GROUP BY dept HAVING AVG(salary) &gt; 300000;</code>。COUNT(*)は行数、COUNT(列)はその列がNULLでない行数を数えます。'],['結合と副問合せ','内部結合（INNER JOIN）は結合条件を満たす行だけを返します。外部結合（LEFT/RIGHT/FULL OUTER JOIN）は片側または両側に対応行がなくてもNULLで補って返します。','副問合せはSQL文の中に置くSELECTです。IN、EXISTS、比較演算子などと組み合わせます。相関副問合せは外側の各行を参照します。集合演算にはUNION（重複除去）、UNION ALL（重複保持）、INTERSECT、EXCEPTがあります。'],['データの変更','INSERTで追加、UPDATEで変更、DELETEで行を削除します。UPDATEやDELETEでWHEREを省くと全行が対象になるため注意します。DELETEは行を削除し、DROPは表そのものを削除します。TRUNCATEは表の全行をまとめて消去する命令です。'],['ビューと権限','ビューはSELECT文を元にした仮想表です。複雑な検索の再利用や、利用者に見せる列・行の制限に役立ちます。実体を格納するマテリアライズドビューと区別します。','GRANTで権限を付与し、REVOKEで取り消します。最小権限の原則に従い、利用者には必要な操作だけ許可します。']]},
{id:'design',title:'関数従属性と正規化',icon:'⎇',time:'20分',desc:'更新時の異常を防ぐ表設計と正規形を理解する。',sections:[['関数従属性','属性集合Xの値が決まるとYの値が一意に決まるとき、X→Y（関数従属性）と書きます。例：学生番号→氏名。Xは決定項、Yは従属項です。','候補キーは行の全属性を決定する最小の属性集合です。部分関数従属は複合キーの一部だけに非キー属性が従属すること、推移的関数従属はキーから非キー属性を経由して別の非キー属性が決まることです。'],['なぜ正規化するか','一つの表に同じ事実を繰り返し保存すると、挿入異常（登録したい情報だけ追加できない）、更新異常（複数箇所の修正漏れ）、削除異常（行削除で別の情報も失う）が起きます。正規化でデータを適切な表へ分解します。'],['第1〜第3正規形','第1正規形（1NF）は各セルが原子的な値で、繰り返し項目がない状態です。第2正規形（2NF）は1NFかつ、すべての非キー属性が候補キー全体に完全関数従属する状態です（候補キーが単一属性なら部分従属はありません）。','第3正規形（3NF）は2NFかつ、非キー属性が候補キーに推移的に関数従属しない状態です。実務・試験では「非キー属性がキーに、キー全体に、そしてキーだけに従属」と覚えます。'],['BCNFと分解','ボイス・コッド正規形（BCNF）は、すべての非自明な関数従属X→Yで、Xがスーパーキーとなる状態です。一般に3NFより厳しい条件です。','表を分解するときは、情報無損失（結合で元の表を復元できる）と従属性保存（制約を各表で検査できる）が重要です。正規化を進めるほど表が増えて結合が必要になり、性能や使いやすさのため意図的に非正規化することもあります。']]},
{id:'transaction',title:'トランザクションと同時実行制御',icon:'⇄',time:'20分',desc:'ACID特性、ロック、直列化可能性を整理する。',sections:[['トランザクションとACID','トランザクションは、一連のDB操作をひとまとまりとして扱う単位です。銀行振込なら「口座Aから減額」と「口座Bへ加額」を両方成功させるか、両方取り消します。','ACID：原子性（Atomicity）=全部実行か全部取消、整合性（Consistency）=制約を満たす状態から満たす状態へ、分離性（Isolation）=同時実行の影響を制御、耐久性（Durability）=COMMIT後は障害後も反映を保つ。'],['同時実行時の問題','他トランザクションの未確定データを読むダーティリード、同じ行を再読して値が変わるノンリピータブルリード、同じ条件で再検索して行が増減するファントムリードなどがあります。','ロストアップデートは、双方が同じ値を読み、後の書込みが先の更新を上書きする問題です。分離レベルを高めると異常を防げますが、同時実行性が下がる場合があります。'],['ロックと直列化','共有ロック（S）は読み取り用で複数取得可能、専有ロック（X）は書込み用で他のロックと競合します。2相ロック（2PL）はロック獲得期間と解放期間を分け、直列化可能な実行を保証します。','ロック待ちが循環するとデッドロックです。DBMSは検出して一方をロールバックするなどして解決します。タイムアウトやロック順序の統一も対策です。悲観的制御はロックで競合を防ぎ、楽観的制御は更新時に競合を検査します。'],['分離レベル','一般的な分離レベルはREAD UNCOMMITTED、READ COMMITTED、REPEATABLE READ、SERIALIZABLEです。低いほど並行性が高い一方、読み取り異常が起きやすくなります。','MVCC（多版型同時実行制御）はデータの複数バージョンを保持し、読み手と書き手の競合を減らします。具体的な分離レベルと異常の扱いは製品ごとに違うため、試験問題の前提に従います。']]},
{id:'recovery',title:'障害回復・ログ・バックアップ',icon:'↺',time:'15分',desc:'障害に備えるログ、チェックポイント、バックアップを学ぶ。',sections:[['ログと回復','DBMSは更新前後の情報をログに記録し、障害から回復します。WAL（先行書込みログ）では、データページを書き出す前に対応するログを安定記憶へ書きます。','障害回復では、COMMIT済みだがDBに未反映の更新をREDO（再実行）し、未COMMITの更新をUNDO（取消）します。チェックポイントは回復対象のログを絞り、再起動時間を短縮します。'],['障害の種類','トランザクション障害は論理エラーやデッドロックなど、システム障害はOS停止・停電、媒体障害はディスク故障などです。障害の範囲に応じてUNDO/REDOやバックアップからの復元を使います。'],['バックアップと可用性','フルバックアップは全体、差分バックアップは前回のフル以降の変更、増分バックアップは直前のバックアップ以降の変更を保存します。増分は容量・取得時間を抑えやすい一方、復元時に連鎖したバックアップが必要です。','アーカイブログを組み合わせると、バックアップ時点以降の更新ログを適用して任意時点に近い復旧ができます。RPOは許容できるデータ損失量（時点）、RTOは許容できる復旧時間です。バックアップは取得だけでなく復元手順の検証が必要です。']]},
{id:'performance',title:'索引・性能・運用管理',icon:'⚙',time:'20分',desc:'索引と実行計画、権限・監査・障害対策の基本。',sections:[['索引の仕組み','索引（インデックス）は検索を速くするための補助構造です。B木・B+木は範囲検索や順序検索に向き、ハッシュ索引は等価検索に向きます。主キーやUNIQUE制約には索引が使われることがあります。','索引は読み取りを速くする一方、領域を消費し、INSERT/UPDATE/DELETE時の保守コストを増やします。選択性（異なる値の多さ）が低い列では効果が小さい場合があります。複合索引は列順が重要で、先頭列を条件に使う検索で効果を発揮しやすいです。'],['SQL性能の確認','実行計画はSQLをDBMSがどのように実行するかを示します。全表走査か索引走査か、結合順序・方式、見積行数などを確認します。EXPLAINなどの機能が利用されます。','性能改善は、不要な列・行の取得を避ける、結合条件を確認する、適切な索引を設ける、統計情報を更新するなどから行います。索引を増やせば必ず速くなるわけではありません。'],['運用・セキュリティ','認証は利用者の本人確認、認可は許可された操作の制御です。ロールで権限をまとめ、最小権限を適用します。監査ログで誰がいつ何を行ったか記録し、暗号化で保存時・通信時の漏えいに備えます。','運用では容量・性能監視、パッチ適用、バックアップ、障害訓練、変更管理を行います。可用性を高める仕組みにレプリケーション（複製）、クラスタリング、フェールオーバーがあります。レプリカの遅延や切替時の整合性も考慮します。']]},
{id:'distributed',title:'分散データベースと応用',icon:'◎',time:'15分',desc:'分散DB、NoSQL、データ分析系の基礎を知る。',sections:[['分散データベース','分散DBは複数の場所にデータを配置し、利用者には一つのDBのように見せます。水平分割（シャーディング）は行を分け、垂直分割は列を分けます。レプリケーションはデータを複製します。','分散トランザクションでは複数ノード間の原子性が課題です。2相コミットは準備フェーズとコミットフェーズで合意しますが、調整役障害時に停止する可能性があります。CAP定理は分断時に一貫性と可用性を同時には完全保証できないという考え方です。'],['NoSQLとスケーリング','NoSQLにはキーバリュー（高速なキー参照）、ドキュメント（JSON等の柔軟な構造）、列指向（大規模分析）、グラフ（関係の探索）などがあります。用途に応じて選びます。','スケールアップは単一機器の性能向上、スケールアウトは機器を追加して分散処理することです。分散ではネットワーク障害、データ配置、整合性、再試行の設計が必要です。'],['分析用データベース','OLTPは短い取引処理を大量に実行し、正規化されたデータと高い整合性を重視します。OLAPは大量データを集約・分析し、スター・スキーマや多次元データを使うことがあります。','ETLは抽出（Extract）・変換（Transform）・格納（Load）、ELTは先に格納してから変換する方法です。データウェアハウスに蓄積した履歴をBIや意思決定に利用します。']]},
{id:'fe-topics',title:'試験頻出：スキーマ・関係演算・運用',icon:'✦',time:'15分',desc:'IPAシラバスの周辺項目と、混同しやすい用語を補う。',sections:[['3層スキーマとデータ独立性','外部スキーマは利用者・プログラムごとの見え方、概念スキーマはDB全体の論理構造、内部スキーマは記憶装置上の物理構造です。外部／概念／内部の対応を分け、変更の影響を抑えます。','データディクショナリ（カタログ）はデータ定義や属性などのメタデータを管理します。リポジトリは開発・保守に関する情報を一元管理する仕組みです。'],['関係演算','選択は条件に合う行を取り出す演算、射影は必要な列を取り出す演算、結合は関連する表を組み合わせる演算です。直積は両表の行の全組合せ、和・差・積（共通）は互換な表に対する集合演算です。','商演算は「すべての条件を満たす」対象を求めるときに使います（例：必修科目をすべて履修した学生）。SQLではNOT EXISTSなどを組み合わせて表現できます。'],['埋込みSQLとカーソル','埋込みSQLはCなどの親言語のプログラム内にSQLを記述する方式です。単一行を扱う非カーソル操作に対し、複数行の検索結果はカーソルを宣言し、OPEN・FETCHで一行ずつ読み、CLOSEで閉じます。','対話型SQLは利用者がSQLを直接実行する方式です。試験では、SQL単独実行と親言語からの埋込み、カーソルが複数行を順次処理する点を区別します。'],['物理設計と再編成','物理設計ではデータ量・ディスク容量を見積もり、論理構造をファイルや記憶領域へ割り当て、アクセス性能を評価します。索引、クラスタ化、分割などの選択は検索と更新の負荷を見て決めます。','データの追加・削除・更新が続くと領域の断片化や索引効率低下が起きる場合があります。DBの再編成や統計情報の更新は、アクセス効率を保つための運用作業です。']]}
];
let state=JSON.parse(localStorage.getItem('dbms-state')||'{"done":[],"answered":{},"streak":0,"last":""}');let page='home',currentModule=modules[0].id,cardIndex=0,cardFlipped=false,quizFilter='all',quizSession=[];const QUIZ_SESSION_SIZE=10;function save(){localStorage.setItem('dbms-state',JSON.stringify(state))}function pct(id){return state.done.includes(id)?100:0}function elapsed(m){return m.time}function startQuiz(){quizSession=quizData.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,Math.min(QUIZ_SESSION_SIZE,quizData.length));quizFilter='all'}
function home(){let completed=state.done.length;return `<div class="top"><div class="crumb">学習室 / ホーム</div><div class="top-right"><div class="streak">🔥 ${state.streak||0} 日連続</div><div class="avatar">学</div></div></div><section class="hero"><div class="eyebrow">DATABASE MANAGEMENT · FE EXAM PREP</div><h1>DBMSの仕組みを、<br>基礎からしっかり身につけよう。</h1><p>試験に出る知識を、理解して使える知識へ。</p><button class="button" onclick="openLesson('${modules.find(m=>!state.done.includes(m.id))?.id||modules[0].id}')">学習をはじめる　→</button></section><div class="stats"><div class="stat"><div><small>コース完了</small><strong>${completed}<span style="font-size:13px;color:var(--muted)"> / ${modules.length}</span></strong></div><span class="badge">✓</span></div><div class="stat"><div><small>学習進捗</small><strong>${Math.round(completed/modules.length*100)}<span style="font-size:13px;color:var(--muted)">%</span></strong></div><span class="badge">↗</span></div><div class="stat"><div><small>問題に回答</small><strong>${Object.keys(state.answered).length}<span style="font-size:13px;color:var(--muted)"> / ${quizData.length}</span></strong></div><span class="badge">✎</span></div></div><div class="section-head"><div><h2>学習コース</h2><p>基礎から応用へ、順番に進めましょう。</p></div><button class="linkbtn" onclick="setPage('lessons')">すべて見る →</button></div><div class="grid">${modules.map((m,i)=>`<article class="card course" onclick="openLesson('${m.id}')"><div class="num">MODULE ${String(i+1).padStart(2,'0')}　·　${m.time}</div><h3>${m.icon}　${m.title}</h3><p>${m.desc}</p><div class="progress-line"><i style="width:${pct(m.id)}%"></i></div><div class="meta"><span>${state.done.includes(m.id)?'完了':'未完了'}</span><span>${pct(m.id)}%</span></div></article>`).join('')}</div><div class="lower"><div class="card panel"><h3>このアプリで学べること</h3>${[['🧭','DB設計の考え方','ER図・キー・正規化'],['⌨️','SQLの読み書き','検索・集約・結合・更新'],['🔐','安全なデータ管理','ACID・同時実行・障害回復']].map(a=>`<div class="topic-row"><span class="topic-icon">${a[0]}</span><div><b>${a[1]}</b><small>${a[2]}</small></div><span>→</span></div>`).join('')}</div><div class="card panel daily"><div class="eyebrow" style="color:#d0bd9e;opacity:1">TODAY'S TIP</div><div class="quote">「WHEREは集約前、HAVINGは集約後」<br>SQLの絞り込み順を整理しよう。</div><small>まずは小さな疑問を一つずつ解決。</small></div></div><div class="footer">学習データはこのブラウザ内に保存されます</div>`}
const quizData=[
{q:'DBMSがデータとプログラムの独立性を高める利点として適切なものは？',opts:['格納方法を変更しても、アプリケーションへの影響を小さくできる','すべての表を一つのファイルにまとめられる','データ入力が不要になる','ネットワークが必ず高速になる'],a:0,e:'DBMSがデータとアプリケーションの間に入ることで、物理的な格納方法などの変更をアプリケーションから隠せます。'},
{q:'主キーに関する説明として適切なものは？',opts:['重複値やNULLを許す','行を一意に識別し、NULLを許さない','他表の値を参照するためだけの列','複数の候補キーを必ず同時に指定する'],a:1,e:'主キーは行を一意に識別するキーで、重複とNULLを許しません。'},
{q:'SQLで集約後のグループを条件で絞り込む句は？',opts:['WHERE','ORDER BY','HAVING','FROM'],a:2,e:'WHEREは集約前の行、HAVINGはGROUP BYで集約した後のグループを絞ります。'},
{q:'複合主キーの一部にだけ非キー属性が従属する問題を解消する正規形は？',opts:['第1正規形','第2正規形','第3正規形','BCNF'],a:1,e:'第2正規形は第1正規形であり、非キー属性が候補キー全体に完全関数従属する状態です。'},
{q:'トランザクションのACID特性で、COMMIT後の更新が障害後も残る性質は？',opts:['原子性','整合性','分離性','耐久性'],a:3,e:'耐久性（Durability）は、確定した変更が障害後にも保持される性質です。'},
{q:'検索性能を向上させる一方、更新処理の負荷が増えることがあるものは？',opts:['外部キー','ビュー','索引','ロール'],a:2,e:'索引は検索を速めますが、更新ごとに索引も保守する必要があり、追加コストと領域を使います。'},
{q:'参照整合性を保つために使う制約は？',opts:['CHECK制約','外部キー制約','DEFAULT制約','NOT NULL制約'],a:1,e:'外部キー制約により、参照先に存在しない値を参照することを防ぎます。'},
{q:'未確定の更新を取り消す障害回復操作は？',opts:['REDO','UNDO','CHECKPOINT','COMMIT'],a:1,e:'UNDOは未確定の更新を取り消し、REDOは確定済みだが未反映の更新を再実行します。'},
{q:'同じ条件で再検索したとき、行の追加・消失が見える現象は？',opts:['ダーティリード','ロストアップデート','ファントムリード','デッドロック'],a:2,e:'ファントムリードでは、同じ条件の検索結果に行が現れたり消えたりします。'},
{q:'多対多の関連を関係表に変換するときの一般的な方法は？',opts:['片方の表を削除する','両方の主キーを持つ中間表を作る','主キーをNULLにする','ビューだけで表す'],a:1,e:'中間表を作って両側の主キーを外部キーとして保持し、関連自体の属性もそこに置きます。'},
{q:'NULLである行を検索するSQL条件は？',opts:['column = NULL','column == NULL','column IS NULL','column IN NULL'],a:2,e:'NULLの判定にはIS NULLまたはIS NOT NULLを使います。NULLとの=比較はUNKNOWNになります。'},
{q:'前回フルバックアップ以降の変更を保存する方式は？',opts:['差分バックアップ','増分バックアップ','ミラーリング','チェックポイント'],a:0,e:'差分は前回のフルバックアップ以降の変更を保存します。増分は直前のバックアップ以降です。'}
,{q:'商品表から「価格が1000円以上」の行だけを取り出すSQL句は？',opts:['HAVING','WHERE','ORDER BY','GROUP BY'],a:1,e:'WHEREは集約前の行を条件で絞り込みます。価格のような各行の値に対する条件に使います。'}
,{q:'部署ごとの社員数を求めるSQLで、集約単位を指定する句は？',opts:['GROUP BY','ORDER BY','DISTINCT','VALUES'],a:0,e:'GROUP BYは指定した列の値が同じ行をグループ化し、COUNTなどの集約関数を適用します。'}
,{q:'COUNT(*)とCOUNT(列名)の説明として適切なものは？',opts:['どちらもNULLを含む全行を数える','COUNT(*)は行数、COUNT(列名)はその列がNULLでない行数を数える','COUNT(列名)だけが重複を除いて数える','COUNT(*)は主キーがある表でだけ使える'],a:1,e:'COUNT(*)は行全体を数え、COUNT(列名)は指定列がNULLの行を数えません。重複を除く場合はCOUNT(DISTINCT 列名)です。'}
,{q:'左外部結合（LEFT OUTER JOIN）の結果として適切なものは？',opts:['左表の行はすべて残り、右表に対応行がなければ右側の列がNULLになる','両表に一致する行だけ残る','右表の行は必ずすべて残る','結合条件に関係なく全組合せを作る'],a:0,e:'左外部結合は左表の全行を残します。右表に一致する行がない場合、右表由来の列はNULLになります。'}
,{q:'表の各行を一意に識別できる最小の属性集合は何と呼ばれる？',opts:['外部キー','候補キー','非キー属性','ビュー'],a:1,e:'候補キーは行を一意に識別できる最小の属性集合です。そのうち主キーとして選ばれたものが主キーです。'}
,{q:'第1正規形の説明として適切なものは？',opts:['各属性の値が原子的で、繰返し項目を持たない','推移的関数従属がない','すべての属性が主キーである','外部キーを持たない'],a:0,e:'第1正規形では、各セルに分割できない値を格納し、繰返し項目を排除します。'}
,{q:'第3正規形を目指す主な目的は？',opts:['推移的関数従属による更新時の冗長性を抑える','すべての検索を索引なしで高速化する','NULLを完全になくす','表を必ず一つに統合する'],a:0,e:'第3正規形では、非キー属性から別の非キー属性への推移的な従属を排除し、更新時の不整合を抑えます。'}
,{q:'銀行振込で、出金だけ成功して入金が失敗する状態を防ぐACID特性は？',opts:['原子性','耐久性','分離性','独立性'],a:0,e:'原子性はトランザクション内の処理をすべて実行するか、すべて取り消す性質です。'}
,{q:'同じデータを複数の処理が同時に更新して、一方の更新が失われる現象は？',opts:['ファントムリード','ロストアップデート','ダーティリード','デッドロック'],a:1,e:'ロストアップデートは、並行更新の結果、一方の更新内容がもう一方に上書きされて失われる現象です。'}
,{q:'他のトランザクションがCOMMITしていない値を読み取る現象は？',opts:['ダーティリード','ファントムリード','ロストアップデート','直列化'],a:0,e:'ダーティリードは、未確定の更新値を別のトランザクションが読み取る現象です。'}
,{q:'ログ先行書込み（WAL）の基本的な考え方は？',opts:['データページより先に更新ログを安定記憶へ書く','バックアップを取らずにログを削除する','更新のたびに表全体を複製する','索引を無効にしてから更新する'],a:0,e:'WALではデータページを書き出す前にログを安定記憶へ記録し、障害時にUNDOやREDOで回復できるようにします。'}
,{q:'ビューの説明として適切なものは？',opts:['SELECT文を基に定義される仮想表','必ずデータを二重に格納する実表','トランザクションのログ','主キーを自動生成する制約'],a:0,e:'ビューは問い合わせ結果を表のように扱う仕組みです。利用者に見せる列や行を限定する用途にも使えます。'}
,{q:'索引を追加した場合に起こり得る影響は？',opts:['検索が速くなる場合がある一方、更新時の保守負荷や領域が増える','すべての更新が必ず速くなる','表の主キーが不要になる','データの重複が自動的になくなる'],a:0,e:'索引は検索性能を改善することがありますが、追加・更新・削除時の索引保守と記憶領域が必要です。'}
,{q:'SQLのUNIONとUNION ALLの違いは？',opts:['UNIONは重複行を除き、UNION ALLは重複行を残す','UNION ALLだけが列数の異なる検索結果を結合できる','UNIONは行を並べ替えず、UNION ALLは必ず並べ替える','両者に違いはない'],a:0,e:'UNIONは重複行を除去し、UNION ALLは重複を保持します。重複除去が不要ならUNION ALLの方が効率的な場合があります。'}
,{q:'DELETE文とDROP TABLE文の違いとして適切なものは？',opts:['DELETEは行を削除し、DROP TABLEは表そのものを削除する','DELETEは表定義を削除し、DROP TABLEは行だけ削除する','どちらも必ず同じ結果になる','DROP TABLEはWHERE句で行を選べる'],a:0,e:'DELETEは表の行を削除するSQL文です。DROP TABLEは表定義を含めて表を削除します。'}
,{q:'複数の表から関連する行を取り出すSQL操作は？',opts:['JOIN','COMMIT','ROLLBACK','GRANT'],a:0,e:'JOINは結合条件に基づいて複数の表の行を組み合わせます。'}
];
const cards=[['DBMS','データベースの定義・検索・更新・保護を担う管理ソフトウェア。'],['主キー','表の各行を一意に識別するキー。重複値とNULLを許さない。'],['外部キー','他表のキーを参照し、表間の参照整合性を保つ属性。'],['関数従属性','Xの値が決まるとYの値が一意に決まる関係。X→Yと表す。'],['第2正規形','1NFであり、非キー属性が候補キー全体に完全関数従属する状態。'],['第3正規形','2NFであり、非キー属性の推移的関数従属を排除した状態。'],['ACID','原子性・整合性・分離性・耐久性。トランザクションの基本特性。'],['デッドロック','複数の処理が互いのロック解放を待ち、進めなくなる状態。'],['WAL','データページより先にログを安定記憶へ書く回復方式。'],['ビュー','SELECT文を基にした仮想表。アクセス範囲の制御にも使える。'],['B+木','範囲検索や順序検索に適した、索引で広く使われる木構造。'],['RPO / RTO','RPOは許容データ損失量、RTOは許容復旧時間。'],['OLTP / OLAP','OLTPは日常取引処理、OLAPは蓄積データの分析処理。'],['2相ロック','ロック獲得期間と解放期間を分け、直列化可能性を保証する方式。']];
function openLesson(id){currentModule=id;setPage('lessons')}function lessonPage(){let m=modules.find(x=>x.id===currentModule)||modules[0];return `<div class="top"><div class="crumb">学習室 / 学習コース</div><div class="top-right"><div class="streak">🔥 ${state.streak||0} 日連続</div></div></div><div class="page-title"><div><h1>学習コース</h1><p>DBMSの重要テーマを順番に学習できます。</p></div><input class="search" id="lessonSearch" placeholder="コースを検索…" oninput="filterModules(this.value)"></div><div class="lesson-layout"><div class="card lesson-list" id="moduleList">${modules.map((x,i)=>`<button class="${x.id===m.id?'active':''}" data-module="${x.id}" onclick="currentModule='${x.id}';render()">${String(i+1).padStart(2,'0')}　${x.title}${state.done.includes(x.id)?'　✓':''}</button>`).join('')}</div><article class="card lesson-content"><div class="eyebrow" style="color:var(--green);opacity:1">${m.icon}　${m.time} · STUDY GUIDE</div><h1>${m.title}</h1><p class="lead">${m.desc}</p>${m.sections.map((s,i)=>`<h2>${i+1}. ${s[0]}</h2><p>${s[1]}</p>${s[2]?`<p>${s[2]}</p>`:''}`).join('')}<div class="callout"><b>試験対策：</b>用語の定義だけでなく、「どの問題を解決する仕組みか」をセットで覚えると選択肢を見分けやすくなります。</div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:22px"><button class="primary" onclick="toggleDone('${m.id}')">${state.done.includes(m.id)?'✓ 学習済み（クリックで戻す）':'このコースを完了にする'}</button><button class="secondary" onclick="setPage('quiz')">確認問題に進む →</button></div></article></div>`}
function filterModules(q){document.querySelectorAll('#moduleList button').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q.toLowerCase())?'':'none')}
function toggleDone(id){state.done.includes(id)?state.done=state.done.filter(x=>x!==id):state.done.push(id);let today=new Date().toISOString().slice(0,10);if(state.last!==today){state.streak++;state.last=today}save();render()}
function quizPage(){let qs=quizData.map((q,i)=>({q,i})).filter(x=>quizFilter==='all'||(quizFilter==='unanswered'&&state.answered[x.i]===undefined)||(quizFilter==='wrong'&&state.answered[x.i]===false));return `<div class="top"><div class="crumb">学習室 / 確認問題</div></div><div class="page-title"><div><h1>確認問題</h1><p>選択肢を選ぶと正誤と解説が表示されます。</p></div></div><div class="tabs"><button class="tab ${quizFilter==='all'?'active':''}" onclick="quizFilter='all';render()">すべて (${quizData.length})</button><button class="tab ${quizFilter==='unanswered'?'active':''}" onclick="quizFilter='unanswered';render()">未回答</button><button class="tab ${quizFilter==='wrong'?'active':''}" onclick="quizFilter='wrong';render()">要復習</button></div>${qs.length?qs.map(({q,i})=>`<article class="card quiz-card"><div class="num">QUESTION ${String(i+1).padStart(2,'0')}</div><h3>${q.q}</h3>${q.opts.map((o,j)=>`<button class="option ${state.answered[i]!==undefined&&j===q.a?'correct':''} ${state.answered[i]===j&&j!==q.a?'wrong':''}" onclick="answer(${i},${j})" ${state.answered[i]!==undefined?'disabled':''}>${['A','B','C','D'][j]}.　${o}</button>`).join('')}${state.answered[i]!==undefined?`<div class="explain">${state.answered[i]===q.a?'✓ 正解。':'もう一度確認しましょう。'} ${q.e}</div>`:''}</article>`).join(''):'<div class="card empty">該当する問題はありません。</div>'}`}
function answer(i,j){state.answered[i]=j===quizData[i].a?j:false;save();render()}
function cardsPage(){let c=cards[cardIndex];return `<div class="top"><div class="crumb">学習室 / 用語カード</div></div><div class="page-title"><div><h1>用語カード</h1><p>カードをクリックして説明を表示。思い出せたか確認しましょう。</p></div></div><div style="color:var(--muted);font-size:11px;margin-bottom:9px">${cardIndex+1} / ${cards.length}</div><div class="card flash" onclick="cardFlipped=!cardFlipped;render()">${cardFlipped?`<div><div class="eyebrow" style="color:var(--green);opacity:1">DEFINITION</div><div class="definition">${c[1]}</div><div class="hint">クリックして用語に戻る</div></div>`:`<div><div class="eyebrow" style="color:var(--green);opacity:1">TERM</div><div class="term">${c[0]}</div><div class="hint">クリックして答えを見る</div></div>`}</div><div class="flash-actions"><button class="secondary" onclick="cardMove(-1)">← 前へ</button><button class="primary" onclick="cardFlipped=!cardFlipped;render()">${cardFlipped?'用語を見る':'答えを見る'}</button><button class="secondary" onclick="cardMove(1)">次へ →</button></div><div class="card panel" style="margin-top:25px"><h3>学習のコツ</h3><p style="font-size:12px;color:var(--muted);margin:0">答えを見る前に、定義を自分の言葉で説明してみましょう。迷った用語はコース本文や確認問題で復習できます。</p></div>`}
function cardMove(n){cardIndex=(cardIndex+n+cards.length)%cards.length;cardFlipped=false;render()}
function progressPage(){let correct=Object.values(state.answered).filter(x=>x!==false).length,total=Object.keys(state.answered).length;return `<div class="top"><div class="crumb">学習室 / 学習記録</div></div><div class="page-title"><div><h1>学習記録</h1><p>このブラウザに保存された現在の学習状況です。</p></div><button class="secondary" onclick="resetProgress()">記録をリセット</button></div><div class="stats"><div class="stat"><div><small>完了したコース</small><strong>${state.done.length}<span style="font-size:13px;color:#87928b"> / ${modules.length}</span></strong></div></div><div class="stat"><div><small>回答した問題</small><strong>${total}<span style="font-size:13px;color:#87928b"> / ${quizData.length}</span></strong></div></div><div class="stat"><div><small>正解率</small><strong>${total?Math.round(correct/total*100):0}<span style="font-size:13px;color:#87928b">%</span></strong></div></div></div><div class="section-head"><div><h2>コース別の進捗</h2><p>読み終えたコースは完了ボタンで記録できます。</p></div></div><div class="card panel">${modules.map((m,i)=>`<div class="topic-row"><span class="topic-icon">${m.icon}</span><div><b>${String(i+1).padStart(2,'0')}　${m.title}</b><small>${m.time} · ${state.done.includes(m.id)?'完了':'未完了'}</small></div><span style="min-width:45px;text-align:right">${pct(m.id)}%</span></div>`).join('')}</div>`}
function resetProgress(){if(confirm('学習記録と問題の回答をすべて削除しますか？')){state={done:[],answered:{},streak:0,last:''};save();render()}}
function setPage(p){if(p==='quiz'&&page!=='quiz')startQuiz();page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}function render(){let root=document.getElementById('app');if(page==='home')root.innerHTML=home();if(page==='lessons')root.innerHTML=lessonPage();if(page==='quiz')root.innerHTML=quizPage();if(page==='cards')root.innerHTML=cardsPage();if(page==='progress')root.innerHTML=progressPage();bind()}function quizPage(){let qs=quizSession.map(i=>({q:quizData[i],i})).filter(x=>quizFilter==='all'||(quizFilter==='unanswered'&&state.answered[x.i]===undefined)||(quizFilter==='wrong'&&state.answered[x.i]===false));return `<div class="top"><div class="crumb">学習室 / 確認問題</div></div><div class="page-title"><div><h1>確認問題</h1><p>問題バンク${quizData.length}問から毎回ランダムに${QUIZ_SESSION_SIZE}問出題します。</p></div><button class="secondary" onclick="startQuiz();render()">別の10問にする ↻</button></div><div class="tabs"><button class="tab ${quizFilter==='all'?'active':''}" onclick="quizFilter='all';render()">今回の10問 (${quizSession.length})</button><button class="tab ${quizFilter==='unanswered'?'active':''}" onclick="quizFilter='unanswered';render()">未回答</button><button class="tab ${quizFilter==='wrong'?'active':''}" onclick="quizFilter='wrong';render()">要復習</button></div>${qs.length?qs.map(({q,i})=>`<article class="card quiz-card"><div class="num">QUESTION ${String(quizSession.indexOf(i)+1).padStart(2,'0')}</div><h3>${q.q}</h3>${q.opts.map((o,j)=>`<button class="option ${state.answered[i]!==undefined&&j===q.a?'correct':''} ${state.answered[i]===j&&j!==q.a?'wrong':''}" onclick="answer(${i},${j})" ${state.answered[i]!==undefined?'disabled':''}>${['A','B','C','D'][j]}.　${o}</button>`).join('')}${state.answered[i]!==undefined?`<div class="explain">${state.answered[i]===q.a?'✓ 正解。':'もう一度確認しましょう。'} ${q.e}</div>`:''}</article>`).join(''):'<div class="card empty">該当する問題はありません。</div>'}`}
function bind(){document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page))}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));render();
</script></body></html>
