<body><div class="shell"><aside class="side"><div><div class="brand">🌐 ネットワーク<small>FE EXAM · NETWORK</small></div><nav class="snav"><div class="slabel">学習メニュー</div><button class="active" data-page="home"><span class="n">⌂</span>概要</button><button data-page="lessons"><span class="n">01</span>コース</button><button data-page="quiz"><span class="n">✓</span>確認問題</button><button data-page="progress"><span class="n">◷</span>学習記録</button></nav></div><div class="side-tip">仕組みを図にして、<br><b>通信の流れ</b>で覚えよう。</div></aside><main id="app"></main></div>
<script>
const lessons=[
{title:'ネットワークの基礎',time:'12分',desc:'ネットワークの目的、構成、回線交換とパケット交換。',parts:[['ネットワークとは','複数のコンピュータや機器を通信回線で接続し、データや資源を共有する仕組みです。端末、サーバ、伝送媒体、ネットワーク機器、通信規約（プロトコル）などで構成されます。'],['LAN・WAN・インターネット','LANは建物や敷地内など狭い範囲、WANは離れた拠点間など広い範囲を結ぶネットワークです。インターネットは世界規模で相互接続されたネットワークです。PANやMANなど、範囲による分類もあります。'],['通信方式とトポロジ','回線交換は通信中に専用の経路を占有し、パケット交換はデータを小さな単位に分けて回線を共有します。パケット交換は効率よく回線を使えますが、遅延や到着順の変化が起こり得ます。','トポロジは機器の接続形態です。スター型は中心機器に接続し管理しやすく、バス型は共通の伝送路を共有、リング型は輪状に接続します。'] ]},
{title:'通信モデルとLAN',time:'15分',desc:'OSI参照モデル、TCP/IP、Ethernetと無線LAN。',parts:[['OSI参照モデル','通信機能を7階層に分けたモデルです。下位から、物理層（信号）、データリンク層（隣接機器間の転送）、ネットワーク層（経路選択）、トランスポート層（端末間通信）、セッション層、プレゼンテーション層、アプリケーション層です。','TCP/IPモデルは一般にネットワークインタフェース、インターネット、トランスポート、アプリケーションの階層で説明します。カプセル化では、上位層のデータに各層の制御情報（ヘッダ等）を付けて送ります。'],['EthernetとMACアドレス','Ethernetは有線LANの代表的な規格です。データリンク層ではMACアドレスを使い、同一LAN内でフレームを届けます。スイッチングハブはMACアドレスを学習し、宛先に応じてフレームを転送します。','リピータは信号を中継・再生し、ブリッジやスイッチはデータリンク層で区間を接続します。ルータはネットワーク層で異なるネットワークを接続します。'],['無線LAN','無線LAN（Wi-Fi）はアクセスポイントを介して端末を接続します。SSIDは無線ネットワーク名です。電波は壁などの影響や干渉を受けるため、配置やチャネル設計が通信品質に影響します。','暗号化方式にはWPA2、WPA3などがあります。強固な認証・暗号化を使い、初期パスワードを変更し、不要な公開ネットワーク接続を避けます。']]},
{title:'IPアドレスとサブネット',time:'18分',desc:'IPv4・IPv6、ネットワーク部とホスト部、CIDR表記。',parts:[['IPアドレスの役割','IPアドレスはネットワーク上の機器を識別する論理アドレスです。IPv4は32ビット、IPv6は128ビットです。IPv4は通常、8ビットずつ10進数で表し、IPv6は16進数をコロンで区切って表記します。','サブネットマスクまたはプレフィックス長で、ネットワーク部とホスト部を区別します。CIDRの /24 は先頭24ビットがネットワーク部であることを示します。'],['サブネットの計算','IPv4のホスト部がhビットなら、通常のサブネットで利用可能なホスト数は 2^h − 2 です（ネットワークアドレスとブロードキャストアドレスを除く）。例えば /24 はホスト部8ビットなので254台、/26 はホスト部6ビットなので62台です。','/24（255.255.255.0）を4分割すると/26になり、各サブネットは64個ずつアドレスを持ちます。先頭がネットワークアドレス、末尾がブロードキャストアドレスです。特殊な用途のサブネットでは例外があります。'],['グローバル・プライベート','グローバルIPアドレスはインターネット上で一意に割り当てられます。プライベートIPv4アドレスは組織内などで使い、ルータのNATでグローバルアドレスへ変換して外部通信する構成があります。','IPv6はアドレス空間が広く、ブロードキャストを使わずマルチキャストなどを用います。IPv4との共存・移行にはデュアルスタックやトンネリングなどの方式があります。']]},
{title:'通信の中継と自動設定',time:'14分',desc:'ルーティング、ARP、DHCP、NATの役割を整理。',parts:[['ルーティング','ルータは宛先IPアドレスを見て経路表を参照し、次に転送する先を決めます。経路表には宛先ネットワークと次ホップなどが登録されます。複数経路から適切な経路を選ぶ処理をルーティングといいます。','同一ネットワーク内では直接届け、異なるネットワーク宛てはデフォルトゲートウェイへ送ります。TTL（IPv6ではHop Limit）は転送ごとに減少し、無限ループでパケットが流れ続けることを防ぎます。'],['ARP・DHCP','ARPは同一IPv4ネットワーク内で、既知のIPアドレスに対応するMACアドレスを調べます。DHCPは端末にIPアドレス、サブネットマスク、デフォルトゲートウェイ、DNSサーバなどを自動設定します。','DHCPの基本的な流れはDiscover、Offer、Request、Acknowledge（DORA）です。DNSは名前からIPアドレスを調べる仕組みであり、DHCPとは役割が異なります。'],['NATとポート変換','NATはIPアドレスを変換する技術です。NAPT（IPマスカレード）はIPアドレスに加えてポート番号も変換し、複数端末が一つのグローバルIPv4アドレスを共有できるようにします。','NATはアドレス節約や内部アドレスの隠蔽に使われますが、エンドツーエンド通信を妨げる場合があり、セキュリティ機能そのものではありません。']]},
{title:'TCP・UDPとポート番号',time:'16分',desc:'トランスポート層の信頼性、接続、代表的なポート。',parts:[['TCPとUDP','TCPはコネクション型で、順序制御、再送制御、誤り検出、フロー制御などを行い、信頼性の高いバイトストリームを提供します。接続確立には3ウェイハンドシェイクを使います。','UDPはコネクションレス型で、再送や順序保証などを基本的に行わず、ヘッダが小さく遅延を抑えやすい方式です。用途に応じて音声・動画配信、DNS問い合わせなどで使われます。'],['ポート番号','IPアドレスが通信相手のホストを識別するのに対し、ポート番号はホスト内のアプリケーション（サービス）を識別します。TCPとUDPは別々のポート空間を持ちます。','代表例：HTTP TCP/80、HTTPS TCP/443、DNS 53（主にUDP、ゾーン転送等ではTCPも使用）、SMTP TCP/25、POP3 TCP/110、IMAP TCP/143、SSH TCP/22、DHCP UDP/67・68。暗記は用途と一緒に行います。'],['フロー制御と輻輳制御','フロー制御は受信側の処理能力に合わせて送信量を調整します。輻輳制御はネットワーク全体の混雑を避けるため送信量を調整します。どちらも通信効率と安定性に関係します。']]},
{title:'アプリケーションプロトコル',time:'15分',desc:'DNS、Web、メール、ファイル転送などの仕組み。',parts:[['DNSと名前解決','DNSはドメイン名とIPアドレスなどを対応付ける分散型の仕組みです。端末はDNSリゾルバに問い合わせ、必要に応じて階層的に名前を解決します。DNSキャッシュは応答を一定期間保存し、問い合わせを効率化します。','AレコードはIPv4、AAAAはIPv6、CNAMEは別名、MXはメール配送先などを示します。'],['Webと暗号化通信','HTTPはWebでリソースをやり取りするプロトコルです。HTTPSはTLSで通信を暗号化し、サーバ認証や改ざん検知を行います。URL、HTTPメソッド、ステータスコード、CookieなどがWeb通信の基本要素です。','TLSは通信相手の認証、暗号化、完全性の確保に使われます。証明書の有効性や接続先の確認も重要です。'],['電子メールとファイル転送','SMTPはメールの送信・転送に使います。受信にはPOP3またはIMAPを使い、POP3は端末への取り込み、IMAPはサーバ上のメールを複数端末で同期する用途に向きます。','FTPはファイル転送に使われますが、通常のFTPは通信内容を暗号化しません。安全な管理接続にはSSH、ファイル転送にはSFTPなどを使います。NTPは時刻同期に使われます。']]},
{title:'ネットワーク設計・性能・可用性',time:'14分',desc:'帯域、遅延、QoS、冗長化と障害時の考え方。',parts:[['通信性能の指標','帯域幅は単位時間に伝送できるデータ量の上限、スループットは実際に得られる伝送量です。遅延（レイテンシ）はデータが届くまでの時間、ジッタは遅延の揺らぎ、パケット損失は届かないパケットの割合です。','データ量（bit）÷回線速度（bit/s）で理論上の最小転送時間を見積もれます。実際にはプロトコルの制御情報、混雑、再送などの影響で時間が増えます。'],['QoSとネットワーク設計','QoSは通信品質を制御する考え方です。音声や映像など遅延に敏感な通信を優先するため、優先制御や帯域制御を行います。ネットワーク設計では利用者数、通信量、拡張性、コスト、管理性を考慮します。'],['冗長化と可用性','回線や機器を二重化すると、片方の障害時に通信を継続しやすくなります。リンクアグリゲーションは複数リンクを束ね、帯域拡大や冗長性向上を図ります。','冗長化しただけでは不十分で、切替が正しく動くか、単一障害点が残っていないかを確認します。稼働率は、MTBF（平均故障間隔）とMTTR（平均修復時間）から MTBF ÷ (MTBF + MTTR) で求めるモデルがあります。']]},
{title:'ネットワークセキュリティとトラブル対応',time:'17分',desc:'防御技術、VPN、診断コマンドで安全と可用性を守る。',parts:[['ネットワークを守る仕組み','ファイアウォールは通信をルールに基づいて制御します。IDSは不正な通信を検知して通知し、IPSは検知に加えて遮断などの防御を行います。DMZは外部公開サーバを内部ネットワークから分離して配置する領域です。','VPNは公衆網などを使って仮想的な専用通信路を構成し、暗号化などで安全性を高めます。TLSやIPsecなどの技術が使われます。'],['脅威と対策','盗聴、なりすまし、改ざん、DoS/DDoSなどの脅威に対し、暗号化、認証、アクセス制御、監視、冗長化、パッチ適用を組み合わせます。無線LANでは強い暗号方式と認証を使い、管理用ネットワークを分離します。','公開鍵暗号、共通鍵暗号、電子署名、ハッシュ関数の用途を区別しましょう。TLSでは公開鍵暗号を認証・鍵交換に、共通鍵暗号をデータ暗号化に使う構成が一般的です。'],['障害の切り分け','まず物理接続・電源・リンク状態を確認し、次にIP設定、デフォルトゲートウェイ、DNS、アプリケーションの順に切り分けます。症状と確認結果を記録し、変更を一度に増やさないことが大切です。','pingは到達性確認、traceroute（Windowsではtracert）は経路確認、ipconfig / ifconfig はIP設定確認、nslookup はDNS名前解決確認に使います。コマンドの応答だけで原因を断定せず、ファイアウォール等の影響も考えます。']]}
];
const questions=[
['OSI参照モデルで、ルーティングを担当する層は？',['データリンク層','ネットワーク層','トランスポート層','セッション層'],1,'IPアドレスを使った経路選択はネットワーク層の役割です。'],
['IPアドレスとポート番号の説明として正しいものは？',['両方ともLAN内の機器固有の物理アドレス','IPはホスト、ポートはホスト上のサービスを識別','ポート番号はルータだけを識別','IPアドレスはアプリケーションだけを識別'],1,'IPアドレスで通信先ホストを、ポート番号でホスト内のサービスを識別します。'],
['TCPの特徴は？',['順序や再送を扱う信頼性の高い通信','常にUDPより遅い','IPアドレスを自動設定する','ドメイン名をIPへ変換する'],0,'TCPはコネクション型で、順序制御や再送制御などを行います。'],
['DNSの主な役割は？',['IPアドレスをMACアドレスへ変換','ドメイン名などを対応するIPアドレスへ名前解決','IPアドレスを自動配布','Web通信を暗号化'],1,'DNSはドメイン名とIPアドレスなどを対応付ける仕組みです。'],
['DHCPで自動設定されるものとして適切なのは？',['IPアドレスやデフォルトゲートウェイ','WebページのHTML','メール本文','MACアドレスそのもの'],0,'DHCPはIPアドレス、サブネットマスク、ゲートウェイ、DNSサーバなどを自動配布します。'],
['IPv4の /26 サブネットで、通常利用可能なホスト数はいくつ？',['30','62','64','126'],1,'ホスト部は6ビットなので2^6−2=62台です。ネットワークアドレスとブロードキャストアドレスを除きます。'],
['HTTPSでHTTPに加えて使われる主な暗号化通信技術は？',['ARP','TLS','DHCP','ICMP'],1,'HTTPSはTLSを使い、通信の暗号化やサーバ認証、完全性の確保を行います。'],
['不正通信を検知して遮断も行う仕組みは？',['IDS','IPS','DNS','NTP'],1,'IDSは検知・通知、IPSは検知に加えて遮断などの防御を行います。'],
['pingコマンドの主な用途は？',['経路上の全ルータを設定','通信相手への到達性を確認','DNSレコードを変更','ファイルを転送'],1,'pingはICMPを用いた到達性確認に使います。ただし応答がない理由が必ず障害とは限りません。'],
['メールの送信・転送に使われる代表的なプロトコルは？',['SMTP','POP3','IMAP','NTP'],0,'SMTPは電子メールの送信・転送に使います。POP3とIMAPは受信に使います。']
];
let data=JSON.parse(localStorage.getItem('fe-network-progress')||'{"done":[],"answers":{}}'),page='home',current=0,filter='all';
function save(){localStorage.setItem('fe-network-progress',JSON.stringify(data))}function setPage(p){page=p;document.querySelectorAll('.snav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}function goLesson(i){current=i;setPage('lessons')}function render(){let app=document.getElementById('app');let links='<div class="top"><div class="crumb">学習ホーム / ネットワーク</div><div class="toplinks"><a href="index.html">科目選択</a><a href="dbms.html">DBMSへ</a></div></div>';app.innerHTML=links+(page==='home'?home():page==='lessons'?lessonPage():page==='quiz'?quizPage():progressPage());document.querySelectorAll('.snav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page))}
function home(){return `<section class="hero"><div class="eyebrow">FE EXAM · NETWORK FUNDAMENTALS</div><h1>通信の仕組みを、順番に理解しよう。</h1><p>ネットワークの基礎からIP、プロトコル、セキュリティまで。</p></section><div class="stats"><div class="stat"><small>完了コース</small><strong>${data.done.length} / ${lessons.length}</strong></div><div class="stat"><small>学習進捗</small><strong>${Math.round(data.done.length/lessons.length*100)}%</strong></div><div class="stat"><small>回答した問題</small><strong>${Object.keys(data.answers).length} / ${questions.length}</strong></div></div><div class="head"><div><h2>学習コース</h2><p>気になるコースから始められます。</p></div></div><div class="grid">${lessons.map((l,i)=>`<article class="card course" onclick="goLesson(${i})"><div class="meta">MODULE ${String(i+1).padStart(2,'0')} · ${l.time}</div><h3>${l.title}</h3><p>${l.desc}</p><div class="bar"><i style="width:${data.done.includes(i)?100:0}%"></i></div><div class="course-foot"><span>${data.done.includes(i)?'完了':'未完了'}</span><span>${data.done.includes(i)?100:0}%</span></div></article>`).join('')}</div><div class="footer">学習記録はこのブラウザ内に保存されます</div>`}
function lessonPage(){let l=lessons[current];return `<div class="head"><div><h2>学習コース</h2><p>${current+1} / ${lessons.length}　·　${l.time}</p></div><button class="btn secondary" onclick="setPage('home')">一覧へ</button></div><article class="card lesson"><div class="eyebrow">MODULE ${String(current+1).padStart(2,'0')}</div><h1>${l.title}</h1><p class="lead">${l.desc}</p>${l.parts.map((p,i)=>`<h2>${i+1}. ${p[0]}</h2><p>${p[1]}</p>${p[2]?`<p>${p[2]}</p>`:''}`).join('')}<div class="callout"><b>試験対策：</b>各機器がどの層で何を判断するか、またプロトコルの役割とポート番号を対応づけて覚えましょう。</div><div class="actions"><button class="btn primary" onclick="toggleDone(${current})">${data.done.includes(current)?'✓ 学習済み（クリックで戻す）':'このコースを完了にする'}</button><button class="btn secondary" onclick="setPage('quiz')">確認問題へ →</button>${current>0?`<button class="btn secondary" onclick="goLesson(${current-1})">← 前のコース</button>`:''}${current<lessons.length-1?`<button class="btn secondary" onclick="goLesson(${current+1})">次のコース →</button>`:''}</div></article>`}
function toggleDone(i){data.done.includes(i)?data.done=data.done.filter(x=>x!==i):data.done.push(i);save();render()}
function quizPage(){let list=questions.map((q,i)=>({q,i})).filter(x=>filter==='all'||(filter==='unanswered'&&data.answers[x.i]===undefined)||(filter==='wrong'&&data.answers[x.i]!==undefined&&data.answers[x.i]!==x.q[2]));return `<div class="head"><div><h2>確認問題</h2><p>選択肢を選ぶと解説が表示されます。</p></div></div><div class="tabs"><button class="tab ${filter==='all'?'active':''}" onclick="filter='all';render()">すべて</button><button class="tab ${filter==='unanswered'?'active':''}" onclick="filter='unanswered';render()">未回答</button><button class="tab ${filter==='wrong'?'active':''}" onclick="filter='wrong';render()">要復習</button></div>${list.length?list.map(({q,i})=>`<article class="card quiz"><div class="qnum">QUESTION ${String(i+1).padStart(2,'0')}</div><h3>${q[0]}</h3>${q[1].map((o,j)=>`<button class="option ${data.answers[i]!==undefined&&j===q[2]?'good':''} ${data.answers[i]===j&&j!==q[2]?'bad':''}" onclick="answer(${i},${j})" ${data.answers[i]!==undefined?'disabled':''}>${'ABCD'[j]}.　${o}</button>`).join('')}${data.answers[i]!==undefined?`<div class="explain">${data.answers[i]===q[2]?'✓ 正解。':'復習してみましょう。'} ${q[3]}</div>`:''}</article>`).join(''):'<div class="card empty">該当する問題はありません。</div>'}`}
function answer(i,j){data.answers[i]=j;save();render()}
function progressPage(){let n=Object.keys(data.answers).length,correct=Object.entries(data.answers).filter(([i,x])=>x===questions[Number(i)][2]).length;return `<div class="head"><div><h2>学習記録</h2><p>このブラウザに保存された進捗です。</p></div><button class="btn secondary" onclick="resetData()">記録をリセット</button></div><div class="stats"><div class="stat"><small>完了コース</small><strong>${data.done.length} / ${lessons.length}</strong></div><div class="stat"><small>回答数</small><strong>${n} / ${questions.length}</strong></div><div class="stat"><small>正解率</small><strong>${n?Math.round(correct/n*100):0}%</strong></div></div><div class="card record">${lessons.map((l,i)=>`<div class="record-row"><div><b>${String(i+1).padStart(2,'0')}　${l.title}</b><br><small>${data.done.includes(i)?'完了':'未完了'}</small></div><span>${data.done.includes(i)?100:0}%</span></div>`).join('')}</div>`}
function resetData(){if(confirm('ネットワークの学習記録をすべて削除しますか？')){data={done:[],answers:{}};save();render()}}render();
</script></body></html>
