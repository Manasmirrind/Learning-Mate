:root{color-scheme:dark;--bg:#101714;--panel:#19221e;--line:#303d36;--ink:#edf4ef;--muted:#a5b2aa;--green:#56b882;--pale:#203b2d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 'Yu Gothic UI','Meiryo',sans-serif}button{font:inherit;cursor:pointer}.shell{max-width:1440px;margin:auto;min-height:100vh;display:grid;grid-template-columns:252px 1fr}.side{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 17px;background:#141c18;border-right:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;padding:0 10px 26px}.brand-icon{width:38px;height:38px;border-radius:12px;background:#287c55;display:grid;place-items:center}.brand small{display:block;color:var(--muted);font:11px Consolas,monospace;letter-spacing:.1em}.portal{display:block;margin:0 7px 8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:#c8d7ce;text-decoration:none;font-size:12px}.nav-label{padding:14px 11px 7px;color:#9aa49e;font-size:10px;letter-spacing:.14em;font-weight:700}.nav button{width:100%;border:0;background:none;color:#c6d1ca;text-align:left;padding:10px 11px;border-radius:9px;display:flex;align-items:center;gap:10px;font-size:13px}.nav button:hover,.nav button.active{background:var(--pale);color:#a6e4bd}.nav .icon{width:20px;text-align:center}.tip{margin:22px 6px;padding:13px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:12px}main{padding:28px clamp(18px,4vw,55px) 60px;max-width:1160px;width:100%;margin:auto}.crumb{font-size:13px;color:var(--muted);margin-bottom:24px}.hero{padding:28px 32px;border-radius:16px;background:#174d38}.eyebrow,.meta,.qnum{font:12px Consolas,monospace;letter-spacing:.1em;color:#a8dfba}.hero h1{font-size:clamp(25px,3.5vw,36px);margin:9px 0 5px}.hero p{margin:0;color:#dbede1;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:17px 0 25px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}.stat{padding:14px 17px}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:22px}.head{display:flex;justify-content:space-between;align-items:end;margin:26px 0 12px}.head h2{margin:0;font-size:20px}.head p{margin:3px 0 0;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.course{padding:17px;cursor:pointer;transition:.15s}.course:hover{border-color:#63a17b;transform:translateY(-2px)}.course h3,.quiz h3{font-size:16px;margin:7px 0 5px}.course p{font-size:13px;color:var(--muted);margin:0 0 13px}.bar{height:5px;border-radius:4px;background:#2b3731;overflow:hidden}.bar i{display:block;height:100%;background:#64c990}.course-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px}.lesson{padding:clamp(19px,4vw,36px)}.lesson h1{font-size:27px;margin:5px 0}.lesson h2{font-size:19px;margin:27px 0 8px;padding-bottom:7px;border-bottom:1px solid var(--line)}.lesson p{font-size:15px;color:#d0dcd4}.lesson .lead{color:var(--muted)}.callout{background:#20382b;padding:13px 16px;border-left:3px solid #64c990;border-radius:0 8px 8px 0;font-size:14px;margin:19px 0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:23px}.btn{border-radius:8px;padding:10px 15px;font-size:13px;font-weight:700}.primary{background:#287c55;color:white;border:1px solid #287c55}.secondary{background:var(--panel);color:var(--ink);border:1px solid var(--line)}.quiz{padding:20px;margin-bottom:12px}.option{display:block;width:100%;text-align:left;color:#d6e1d9;background:#19221e;border:1px solid var(--line);padding:10px 12px;border-radius:8px;margin:7px 0;font-size:14px}.option:hover:not(:disabled){border-color:#6caa82}.option:disabled{cursor:default}.option.good{background:#203b2d;border-color:#56b882}.option.bad{background:#412a25;border-color:#c77d60}.explain{background:#25312b;padding:10px 12px;border-radius:8px;color:#d7e3db;font-size:13px;margin-top:10px}.tabs{display:flex;gap:8px;margin:15px 0}.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:18px;padding:7px 12px;font-size:13px}.tab.active{background:#287c55;border-color:#287c55;color:white}.empty{padding:36px;text-align:center;color:var(--muted)}.record{padding:19px}.row{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px}.row:last-child{border:0}.row small{color:var(--muted)}.foot{text-align:center;color:#849188;font-size:12px;margin-top:32px}.foot a{color:#81d5a2}

</style></head><body><div class="shell"><aside class="side"><div class="brand"><div class="brand-icon">🔐</div><div><strong>情報セキュリティ</strong><small>FE EXAM · SECURITY</small></div></div><a class="portal" href="index.html">← 科目選択へ</a><nav class="nav"><div class="nav-label">学習メニュー</div><button data-page="home"><span class="icon">⌂</span><span class="label">ホーム</span></button><button data-page="lessons"><span class="icon">▤</span><span class="label">学習コース</span></button><button data-page="quiz"><span class="icon">✓</span><span class="label">確認問題</span></button><div class="nav-label">あなたの学習</div><button data-page="progress"><span class="icon">◷</span><span class="label">学習記録</span></button></nav><div class="tip">守る対象と脅威を結び、<br>対策の目的を考えよう。</div></aside><main id="app"></main></div>
<script>
const modules=[
{title:'情報セキュリティの基礎',time:'14分',desc:'CIA、脅威・脆弱性・リスクと管理の基本。',sections:[['CIAの3要素','機密性は許可された人だけが情報を利用できること、完全性は情報が正確で改ざんされていないこと、可用性は必要なときに利用できることです。3要素をCIAと呼びます。'],['脅威・脆弱性・リスク','脅威は損害を引き起こす要因、脆弱性は悪用される弱点、リスクは脅威が脆弱性を利用して損失を生じさせる可能性と影響です。対応には低減、回避、移転、保有があります。'],['方針とISMS','ポリシーは基本方針・対策基準・手順を定めます。ISMSはリスク評価、対策、監視、見直しを継続する管理の仕組みです。']]},
{title:'脅威とサイバー攻撃',time:'17分',desc:'マルウェア、詐欺、標的型攻撃、サービス妨害。',sections:[['マルウェア','ウイルスは寄生、ワームは単独拡散、トロイの木馬は有用なソフトを装います。ランサムウェアはデータを使えなくし、スパイウェアは情報を収集します。'],['人を狙う攻撃','フィッシングは偽サイトやメールで情報を盗み、標的型攻撃は特定の組織・人を狙います。送信者や依頼内容を別経路で確認します。'],['通信への攻撃','DoS/DDoSはサービス妨害、中間者攻撃は盗聴・改ざん、リプレイ攻撃は過去通信の再送を狙います。パッチ、監視、認証強化を重ねます。']]},
{title:'暗号・ハッシュ・電子署名',time:'18分',desc:'共通鍵・公開鍵暗号、証明書、PKIの使い分け。',sections:[['暗号方式','共通鍵暗号は同じ鍵を使い高速ですが、鍵共有が課題です。公開鍵暗号は公開鍵と秘密鍵のペアを使い、鍵配送や署名に利用します。実際の通信では両方式を組み合わせます。'],['ハッシュと署名','ハッシュはデータから固定長値を計算し改ざん検出に使います。電子署名は文書のハッシュ値に秘密鍵で署名し、公開鍵で送信者と完全性を検証します。秘匿とは目的が異なります。'],['証明書とPKI','公開鍵証明書は認証局（CA）が公開鍵と所有者の対応を証明します。PKIは証明書の発行・検証・失効を支え、TLSなどで利用されます。']]},
{title:'認証・認可・アクセス制御',time:'16分',desc:'MFA、パスワード、最小権限、RBACとSSO。',sections:[['認証と認可','認証は誰・何かを確認すること、認可は許可する操作を決めることです。識別、認証、認可を区別します。'],['多要素認証','認証要素は知識（パスワード）、所持（スマートフォン）、生体（指紋）に分類できます。異なる種類を二つ以上組み合わせるのがMFAです。'],['権限管理','最小権限では必要な権限だけを付与します。RBACは役割に権限を割り当て、ACLは対象ごとに権限を管理します。パスワードはソルト付きハッシュで保管します。']]},
{title:'ネットワークセキュリティ',time:'16分',desc:'ファイアウォール、IDS/IPS、DMZ、VPNとTLS。',sections:[['境界防御','ファイアウォールは通信をルールで許可・拒否します。DMZは公開サーバを内部から分離し、ネットワーク分割は侵入後の横展開を抑えます。'],['検知と防御','IDSは検知・通知、IPSは検知に加えて遮断を行います。WAFはWeb通信を検査し、SIEMは複数機器のログを集約・分析します。'],['セキュア通信','TLSはHTTPS、SSHは安全なリモート操作、IPsecはIP層を保護します。VPNは公衆網に仮想的な専用通信路を構成します。']]},
{title:'アプリケーションとWebの安全',time:'18分',desc:'SQLインジェクション、XSS、CSRFと安全な実装。',sections:[['SQLインジェクション','入力値でSQL文を不正操作する攻撃です。プレースホルダで命令と値を分離し、DB権限を最小化します。'],['XSSとCSRF','XSSはスクリプトをブラウザで実行させる攻撃で、出力時にエスケープします。CSRFは認証済みブラウザに意図しない要求を送らせ、トークンやSameSite Cookieで防ぎます。'],['検査とセッション','セッションIDは推測困難にしログイン後に再発行します。静的検査はソースを、動的検査は実行中の挙動を調べ、ファジングは多様な入力を与えます。']]},
{title:'運用・バックアップ・対応',time:'17分',desc:'パッチ、ログ、復旧、フォレンジックの基本。',sections:[['日常運用','パッチ適用、マルウェア対策、権限棚卸し、不要アカウント停止、ログ監視を継続します。'],['バックアップ','3-2-1ルールは3つのコピー、2種類の媒体、1つの別場所保管です。復元テストを行い、RPOとRTOを定めます。'],['インシデント対応','検知・報告、影響確認、封じ込め、原因除去、復旧、再発防止を進めます。証拠を保全・分析するのがフォレンジックです。']]},
{title:'組織・物理・法令の対策',time:'15分',desc:'教育、職務分掌、施設保護、個人情報管理。',sections:[['組織と人的対策','規程、教育、訓練、委託先管理、権限見直しを行います。職務分掌で申請・承認・実行を分け、異動・退職時は権限を削除します。'],['物理的対策','入退室管理、施錠、監視カメラ、耐震・防火設備、UPS、媒体管理で情報資産を守ります。廃棄時は媒体を消去・破壊します。'],['法令と標準','個人情報の利用目的、アクセス範囲、保存期間、廃棄方法を管理します。ISO/IEC 27001はISMSの要求事項を定める規格です。']]}
];
const questions=[
{q:'偽ログイン画面へ誘導して認証情報を盗む攻撃は？',o:['フィッシング','DDoS','SQLインジェクション','ポートスキャン'],a:0,e:'偽サイトや偽メールで情報を盗む手口です。'},
{q:'ランサムウェア対策として適切なバックアップ運用は？',o:['本番PC内へコピー','3-2-1ルールと復元テスト','ログ削除','全員を管理者にする'],a:1,e:'複数コピー、異なる媒体、別場所保管と復元確認を行います。'},
{q:'SQLインジェクションへの基本対策は？',o:['SQLへ文字列連結','プレースホルダ','エラー全文表示','DBを公開'],a:1,e:'SQL命令と入力値を分離します。'},
{q:'XSS対策は？',o:['出力時の文脈依存エスケープ','Cookie期限延長','IP固定','DB権限追加'],a:0,e:'信頼できない値を表示する際にエスケープします。'},
{q:'CSRFの説明は？',o:['ブラウザに意図しない要求を送らせる','SQLを注入する','スクリプトを実行する','大量通信で停止させる'],a:0,e:'認証済みブラウザを悪用する攻撃です。'},
{q:'高速なデータ暗号化と鍵交換を両立する構成は？',o:['共通鍵だけ','公開鍵だけ','両者の組合せ','ハッシュだけ'],a:2,e:'公開鍵で鍵交換し、データは共通鍵で暗号化します。'},
{q:'電子署名で確認できるものは？',o:['送信者と改ざん有無','回線速度','圧縮率','物理位置'],a:0,e:'署名は認証と完全性の確認です。'},
{q:'安全なパスワード保管は？',o:['平文','固定ソルト','利用者ごとのソルト付きハッシュ','メール保存'],a:2,e:'ソルト付きハッシュで平文を残しません。'},
{q:'MFAの例は？',o:['パスワードと別パスワード','パスワードと指紋','カードを2回','IDを2つ'],a:1,e:'知識と生体という異なる要素を組み合わせます。'},
{q:'IDSとIPSの違いは？',o:['IDSは検知、IPSは検知に加え遮断','暗号化と復号','Web専用とメール専用','違いなし'],a:0,e:'IPSは防止・遮断まで行う場合があります。'},
{q:'インシデント直後の優先行動は？',o:['証拠を消す','影響確認・封じ込め・証拠保全','全ログ公開','全データ削除'],a:1,e:'被害拡大を抑えつつ証拠を保全します。'},
{q:'退職者アカウントのリスク対策は？',o:['退職時の権限削除と定期棚卸し','全員を管理者にする','パスワード共有','監査停止'],a:0,e:'アカウントライフサイクルを管理します。'},
{q:'情報セキュリティの機密性・完全性・可用性のうち、改ざん防止に関係するものは？',o:['機密性','完全性','可用性','追跡可能性'],a:1,e:'完全性は情報が正確で完全な状態を保ち、不正な改ざんや破壊を受けていないことです。'},
{q:'必要な人だけが情報にアクセスできるようにする性質は？',o:['可用性','機密性','完全性','否認防止'],a:1,e:'機密性は許可された人だけが情報を参照できるようにする性質です。'},
{q:'システムが必要なときに利用できる状態を保つ性質は？',o:['完全性','機密性','可用性','真正性'],a:2,e:'可用性は利用者が必要なときに情報やシステムを利用できる性質です。'},
{q:'リスク対応で、保険加入などにより損失の負担を他者へ移す方法は？',o:['回避','低減','移転','受容'],a:2,e:'リスク移転は保険や契約などを通じて、リスクの損失負担を第三者へ移す対応です。'},
{q:'最小権限の原則として適切なのは？',o:['全利用者に管理者権限を付与する','業務に必要な範囲だけ権限を与える','共有アカウントを使う','権限を一度付与したら見直さない'],a:1,e:'利用者やプログラムには、業務遂行に必要な最低限の権限だけを付与します。'},
{q:'生体認証の「本人拒否率（FRR）」が表すものは？',o:['本人を誤って拒否する割合','他人を本人と誤認する割合','認証装置の稼働率','登録に失敗する割合'],a:0,e:'FRRは正当な本人を誤って拒否する割合です。他人を誤って受け入れる割合はFARです。'},
{q:'公開鍵暗号方式で、受信者だけが復号できるよう暗号化する鍵は？',o:['送信者の秘密鍵','受信者の公開鍵','受信者の秘密鍵','認証局の秘密鍵'],a:1,e:'機密性を目的とする場合、受信者の公開鍵で暗号化し、対応する受信者の秘密鍵で復号します。'},
{q:'ハッシュ関数の主な利用目的として適切なのは？',o:['データの改ざん検知やパスワード検証','暗号文を必ず元に戻す','利用者へIPアドレスを配る','通信経路を選ぶ'],a:0,e:'ハッシュ値を比較することでデータの完全性を確認できます。ハッシュ関数は暗号化のように元データへ復号するものではありません。'},
{q:'認証局（CA）の役割は？',o:['公開鍵証明書を発行し、公開鍵と主体の対応を証明する','全Web通信を保存する','パスワードを利用者に代わって決める','ファイアウォールの通信規則を配布する'],a:0,e:'認証局は証明書を発行し、公開鍵が特定の主体に属することを証明します。'},
{q:'ワンタイムパスワードの利点として適切なのは？',o:['同じ認証情報を使い回さず、盗まれた値の再利用リスクを抑える','利用者認証が不要になる','通信を必ず暗号化する','端末のウイルスを自動削除する'],a:0,e:'一度限り、または短時間だけ有効なパスワードを使うことで、盗まれた認証値の再利用を防ぎやすくなります。'},
{q:'マルウェア感染が疑われる端末への初動として適切なのは？',o:['ネットワークから隔離し、組織の手順に従って報告・調査する','端末をすぐ初期化して証拠を消す','警告を無視して使い続ける','全ファイルを外部へ送る'],a:0,e:'感染拡大を防ぐため隔離し、証拠を保全して担当窓口へ報告します。組織のインシデント対応手順に従います。'},
{q:'標的型攻撃メールへの対策として有効なのは？',o:['送信元やリンク先を確認し、不審な添付を開かず報告する','添付ファイルのマクロを常に有効にする','同じパスワードを全サービスで使う','ウイルス対策ソフトを無効にする'],a:0,e:'送信者、リンク、添付ファイルを慎重に確認し、疑わしいメールは組織の窓口へ報告します。'},
{q:'WAFが主に保護する対象は？',o:['WebアプリケーションへのHTTP/HTTPS通信','建物への入退室','電源設備','無線LANの電波強度'],a:0,e:'WAFはWebアプリケーションへの通信を検査し、SQLインジェクションやXSSなどの攻撃を検知・遮断します。'},
{q:'ソフトウェアの脆弱性管理で適切な運用は？',o:['資産と脆弱性を把握し、優先度を付けて修正・更新する','更新を永久に停止する','脆弱性情報を記録しない','すべての修正を本番環境へ無検証で適用する'],a:0,e:'資産・影響・悪用状況を把握し、優先順位を付けて検証と適用を進めます。'},

quizPage=function(){const list=quizSession.map(i=>({q:questions[i],i})).filter(x=>filter==='all'||filter==='unanswered'&&state.answers[x.i]===undefined||filter==='wrong'&&state.answers[x.i]!==undefined&&state.answers[x.i]!==x.q.a);return `<div class="head"><div><h2>確認問題</h2><p>問題バンク${questions.length}問から毎回ランダムに${QUIZ_SESSION_SIZE}問出題します。</p></div><button class="btn secondary" onclick="startQuiz();render()">別の10問にする ↻</button></div><div class="tabs"><button class="tab ${filter==='all'?'active':''}" onclick="filter='all';render()">今回の10問 (${quizSession.length})</button><button class="tab ${filter==='unanswered'?'active':''}" onclick="filter='unanswered';render()">未回答</button><button class="tab ${filter==='wrong'?'active':''}" onclick="filter='wrong';render()">要復習</button></div>${list.length?list.map(({q,i})=>`<article class="card quiz"><div class="qnum">QUESTION ${String(quizSession.indexOf(i)+1).padStart(2,'0')}</div><h3>${q.q}</h3>${q.o.map((o,j)=>`<button class="option ${state.answers[i]!==undefined&&j===q.a?'good':''} ${state.answers[i]===j&&j!==q.a?'bad':''}" onclick="answer(${i},${j})" ${state.answers[i]!==undefined?'disabled':''}>${'ABCD'[j]}. ${o}</button>`).join('')}${state.answers[i]!==undefined?`<div class="explain">${state.answers[i]===q.a?'✓ 正解。':'復習しましょう。'} ${q.e}</div>`:''}</article>`).join(''):'<div class="card empty">該当する問題はありません。</div>'}`};
let state=JSON.parse(localStorage.getItem('fe-security-progress')||'{"done":[],"answers":{}}'),page='home',current=0,filter='all',quizSession=[];const QUIZ_SESSION_SIZE=10;function startQuiz(){quizSession=questions.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,Math.min(QUIZ_SESSION_SIZE,questions.length));filter='all'}
function save(){localStorage.setItem('fe-security-progress',JSON.stringify(state))}function setPage(p){if(p==='quiz'&&page!=='quiz')startQuiz();page=p;render()}function openLesson(i){current=i;setPage('lessons')}function render(){const app=document.getElementById('app');app.innerHTML='<div class="crumb">学習ホーム / 情報セキュリティ</div>'+(page==='home'?home():page==='lessons'?lessonPage():page==='quiz'?quizPage():progressPage());document.querySelectorAll('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.onclick=()=>setPage(b.dataset.page)});document.querySelectorAll('.course[data-module]').forEach(card=>{const open=()=>openLesson(Number(card.dataset.module));card.onclick=open;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}})}
function home(){const done=state.done.length;return `<section class="hero"><div class="eyebrow">FE EXAM · INFORMATION SECURITY</div><h1>脅威と対策を結びつけて学ぼう。</h1><p>基本から暗号、認証、実装、運用まで。</p></section><div class="stats"><div class="stat"><small>完了コース</small><strong>${done} / ${modules.length}</strong></div><div class="stat"><small>学習進捗</small><strong>${Math.round(done/modules.length*100)}%</strong></div><div class="stat"><small>回答した問題</small><strong>${Object.keys(state.answers).length} / ${questions.length}</strong></div></div><div class="head"><div><h2>学習コース</h2><p>Moduleを選んで学習を進めましょう。</p></div></div><div class="grid">${modules.map((m,i)=>`<article class="card course" data-module="${i}" role="button" tabindex="0"><div class="meta">MODULE ${String(i+1).padStart(2,'0')} · ${m.time}</div><h3>${m.title}</h3><p>${m.desc}</p><div class="bar"><i style="width:${state.done.includes(i)?100:0}%"></i></div><div class="course-foot"><span>${state.done.includes(i)?'完了':'未完了'}</span><span>${state.done.includes(i)?100:0}%</span></div></article>`).join('')}</div>`}
function lessonPage(){const m=modules[current];return `<div class="head"><div><h2>学習コース</h2><p>${current+1} / ${modules.length} · ${m.time}</p></div><button class="btn secondary" onclick="setPage('home')">一覧へ</button></div><article class="card lesson"><div class="eyebrow">MODULE ${String(current+1).padStart(2,'0')}</div><h1>${m.title}</h1><p class="lead">${m.desc}</p>${m.sections.map((s,i)=>`<h2>${i+1}. ${s[0]}</h2><p>${s[1]}</p>`).join('')}<div class="callout"><b>試験対策：</b>何を守る対策か、どの脅威に有効かを整理しましょう。</div><div class="actions"><button class="btn primary" onclick="toggleDone(${current})">${state.done.includes(current)?'✓ 学習済み（クリックで戻す）':'このコースを完了にする'}</button><button class="btn secondary" onclick="setPage('quiz')">確認問題へ →</button>${current>0?`<button class="btn secondary" onclick="openLesson(${current-1})">← 前へ</button>`:''}${current<modules.length-1?`<button class="btn secondary" onclick="openLesson(${current+1})">次へ →</button>`:''}</div></article>`}
function toggleDone(i){state.done.includes(i)?state.done=state.done.filter(x=>x!==i):state.done.push(i);save();render()}function answer(i,j){state.answers[i]=j;save();render()}
function quizPage(){const list=questions.map((q,i)=>({q,i})).filter(x=>filter==='all'||filter==='unanswered'&&state.answers[x.i]===undefined||filter==='wrong'&&state.answers[x.i]!==undefined&&state.answers[x.i]!==x.q.a);return `<div class="head"><div><h2>確認問題</h2><p>選択すると正誤と解説が表示されます。</p></div></div><div class="tabs"><button class="tab ${filter==='all'?'active':''}" onclick="filter='all';render()">すべて</button><button class="tab ${filter==='unanswered'?'active':''}" onclick="filter='unanswered';render()">未回答</button><button class="tab ${filter==='wrong'?'active':''}" onclick="filter='wrong';render()">要復習</button></div>${list.length?list.map(({q,i})=>`<article class="card quiz"><div class="qnum">QUESTION ${String(i+1).padStart(2,'0')}</div><h3>${q.q}</h3>${q.o.map((o,j)=>`<button class="option ${state.answers[i]!==undefined&&j===q.a?'good':''} ${state.answers[i]===j&&j!==q.a?'bad':''}" onclick="answer(${i},${j})" ${state.answers[i]!==undefined?'disabled':''}>${'ABCD'[j]}. ${o}</button>`).join('')}${state.answers[i]!==undefined?`<div class="explain">${state.answers[i]===q.a?'✓ 正解。':'復習しましょう。'} ${q.e}</div>`:''}</article>`).join(''):'<div class="card empty">該当する問題はありません。</div>'}`}
function progressPage(){const n=Object.keys(state.answers).length,c=Object.entries(state.answers).filter(([i,v])=>v===questions[Number(i)].a).length;return `<div class="head"><div><h2>学習記録</h2><p>このブラウザに保存された進捗です。</p></div><button class="btn secondary" onclick="resetProgress()">記録をリセット</button></div><div class="stats"><div class="stat"><small>完了コース</small><strong>${state.done.length} / ${modules.length}</strong></div><div class="stat"><small>回答数</small><strong>${n} / ${questions.length}</strong></div><div class="stat"><small>正解率</small><strong>${n?Math.round(c/n*100):0}%</strong></div></div><div class="card record">${modules.map((m,i)=>`<div class="row"><div><b>${String(i+1).padStart(2,'0')}　${m.title}</b><br><small>${state.done.includes(i)?'完了':'未完了'}</small></div><span>${state.done.includes(i)?100:0}%</span></div>`).join('')}</div>`}function resetProgress(){if(confirm('情報セキュリティの学習記録を削除しますか？')){state={done:[],answers:{}};save();render()}}render();
</script></body></html>
